syntax = "proto2";

import "asset.proto";

package hive.protocol.buffers;

/* Related to collateralized_convert_operation.
 * Generated every time above operation is executed. Contains amount of PXS received right when the transfer actually happens.
 * @see fill_collateralized_convert_request
 */
message collateralized_convert_immediate_conversion {
  // @param {string} owner - user that requested conversion (receiver of pxs_out)
  required string owner = 1;

  // @param {number} requested - id of the conversion request
  required uint32 requestid = 2;

  // @param {asset} pxs_out - (PXS) funds after conversion
  required asset  pxs_out = 3 [json_name = "pxs_out"];
}

