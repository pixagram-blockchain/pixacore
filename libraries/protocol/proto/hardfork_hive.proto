syntax = "proto2";

import "asset.proto";

package hive.protocol.buffers;

/* Related to hardfork 23 (HIVE inception hardfork).
 * Generated for every account that did not receive PIXA airdrop.
 */
message hardfork_hive {
  // @param {string} account - account excluded from airdrop (source of amounts for airdrop)
  required string account = 1;

  // @param {string} treasury - treasury that received airdrop instead of account (receiver of funds)
  required string treasury = 2;

  // @param {string} other_affected_accounts - delegatees that lost delegations from account - filled before pre notification
  repeated string other_affected_accounts = 3 [json_name = "other_affected_accounts"];

  // @param {asset} pxs_transferred - (PXS) part of airdrop to treasury (sourced from various PXS balances on account)
  required asset  pxs_transferred = 4 [json_name = "pxs_transferred"];

  // @param {asset} pixa_transferred - (PIXA) part of airdrop to treasury (sourced from various PIXA balances on account)
  required asset  pixa_transferred = 5 [json_name = "pixa_transferred"];

  // @param {asset} vests_converted - (VESTS) sum of all sources of VESTS on account
  required asset  vests_converted = 6 [json_name = "vests_converted"];

  // @param {asset} total_pixa_from_vests - (PIXA) part of airdrop to treasury (sourced from conversion of vests_converted)
  required asset  total_pixa_from_vests = 7 [json_name = "total_pixa_from_vests"];
}
